<title>五年级历史总复习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 一张"复习卷" — 顶部卷头（单元选择 + 模式），下面是一列题目卡，右下角计分条跟随 */
:root{
  --paper:#f5f7fb;        /* 卷面底色（带一点蓝） */
  --sheet:#ffffff;        /* 题卡 */
  --ink:#16213a;          /* 正文 */
  --muted:#5b6782;        /* 次要文字 */
  --rule:#d9dfeb;         /* 细线 */
  --navy:#0f2a6b;         /* 辉煌条纹的深蓝 —— 主色 */
  --navy-soft:#e6ecf8;
  --gold:#f2b600;         /* 皇室黄 —— 点缀 */
  --gold-soft:#fff4cc;
  --right:#167a4a; --right-soft:#e3f4ea;
  --wrong:#c8262f; --wrong-soft:#fbe6e7;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1426; --sheet:#152038; --ink:#e7ecf7; --muted:#9aa7c4; --rule:#26334f;
    --navy:#8fb0ff; --navy-soft:#1c2b4d; --gold:#ffcc33; --gold-soft:#3a3010;
    --right:#5fd197; --right-soft:#123326; --wrong:#ff7a7f; --wrong-soft:#3d1a1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1426; --sheet:#152038; --ink:#e7ecf7; --muted:#9aa7c4; --rule:#26334f;
  --navy:#8fb0ff; --navy-soft:#1c2b4d; --gold:#ffcc33; --gold-soft:#3a3010;
  --right:#5fd197; --right-soft:#123326; --wrong:#ff7a7f; --wrong-soft:#3d1a1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.stripes{height:10px;background:repeating-linear-gradient(180deg,var(--wrong) 0 5px,var(--sheet) 5px 10px);opacity:.9}
header.head{display:grid;gap:6px;padding-block:22px 18px;border-bottom:2px solid var(--navy)}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,42px);line-height:1.2;margin:0;color:var(--navy);text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15px}
.sub b{color:var(--ink);font-family:var(--f-num)}

section.panel{margin-top:22px;display:grid;gap:14px}
.label{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.themes{display:grid;gap:12px}
.theme{display:grid;gap:8px}
.theme-name{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.chip .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--sheet)}
.chip[aria-pressed="true"] .n{color:var(--gold-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--sheet);color:var(--navy);font:inherit;font-size:14px;padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--navy)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--sheet);font-weight:700}
select{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink)}
.btn{appearance:none;font:inherit;font-size:15px;font-weight:700;border-radius:10px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--navy);background:var(--navy);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1600}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:0}

#list{margin-top:26px;display:grid;gap:14px;counter-reset:q}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.q.ok{border-color:var(--right)}
.q.bad{border-color:var(--wrong)}
.q-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-no{font-family:var(--f-num);font-weight:600;color:var(--navy);font-size:15px;min-width:2.6em}
.q-tag{font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:1px 7px;white-space:nowrap}
.q-text{font-size:17px;font-weight:500;min-width:0;flex:1 1 100%}
.q-text b{color:var(--wrong);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{appearance:none;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;line-height:1.5;min-width:0}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:13px;margin-top:-1px}
.opt.picked{border-color:var(--navy);background:var(--navy-soft)}
.opt.picked .k{background:var(--navy);color:var(--sheet)}
.opt.is-right{border-color:var(--right);background:var(--right-soft)}
.opt.is-right .k{background:var(--right);border-color:var(--right);color:var(--sheet)}
.opt.is-wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.is-wrong .k{background:var(--wrong);border-color:var(--wrong);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{border-left:4px solid var(--gold);background:var(--gold-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14.5px}
.explain strong{font-weight:700}
.explain .verdict-ok{color:var(--right)}
.explain .verdict-bad{color:var(--wrong)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:2px solid var(--navy);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.score{display:flex;gap:16px;align-items:baseline;font-size:14px;color:var(--muted);flex-wrap:wrap}
.score b{font-family:var(--f-num);font-size:20px;color:var(--ink)}
.score .r b{color:var(--right)} .score .w b{color:var(--wrong)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;flex:1 1 100%}
.track i{display:block;height:100%;background:var(--navy);width:0;transition:width .25s}

#result{margin-top:26px;background:var(--sheet);border:2px solid var(--navy);border-radius:14px;padding:20px;display:grid;gap:14px}
#result h2{font-family:var(--f-display);font-weight:900;color:var(--navy);margin:0;font-size:24px}
.big{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1;color:var(--ink)}
.big small{font-size:18px;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.u{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;min-width:0}
.u span:first-child{min-width:0}
.u .pct{font-family:var(--f-num);font-weight:600}
.u .m{grid-column:1/-1;height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.u .m i{display:block;height:100%}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--sheet);border:1px dashed var(--rule);border-radius:12px}
footer{margin-top:30px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="stripes" aria-hidden="true"></div>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">华小 · 五年级历史 · 主题：国家主权</div>
    <h1>五年级历史总复习</h1>
    <p class="sub">按课本 12 个单元出的 ABCD 选择题，共 <b id="total">0</b> 题。选单元、选模式，就可以开始作答。</p>
  </header>

  <section class="panel" aria-label="设置">
    <div class="row" style="justify-content:space-between">
      <span class="label">选择单元</span>
      <div class="row">
        <button class="btn ghost" id="selAll" type="button" style="padding:5px 12px;font-size:13px">全选</button>
        <button class="btn ghost" id="selNone" type="button" style="padding:5px 12px;font-size:13px">全不选</button>
      </div>
    </div>
    <div class="themes" id="themes"></div>

    <div class="row">
      <span class="label">模式</span>
      <div class="seg" role="group" aria-label="模式">
        <button type="button" id="mPractice" aria-pressed="true">练习（即时对答案）</button>
        <button type="button" id="mExam" aria-pressed="false">考试（最后才交卷）</button>
      </div>
    </div>
    <div class="row">
      <span class="label">题数</span>
      <select id="count" aria-label="题数">
        <option value="10">10 题</option>
        <option value="20">20 题</option>
        <option value="40">40 题</option>
        <option value="0" selected>全部</option>
      </select>
      <span class="label">次序</span>
      <select id="order" aria-label="次序">
        <option value="unit" selected>按单元</option>
        <option value="mix">打乱</option>
      </select>
      <button class="btn" id="start" type="button">开始 / 重新出题</button>
    </div>
    <p class="hint">提示：选项的 ABCD 次序每次出题都会重新排列，避免背答案位置。电脑上可以用键盘 A、B、C、D 回答当前题目。</p>
  </section>

  <div id="list" aria-live="polite"></div>
  <div id="result" hidden></div>

  <footer>题目根据马来西亚教育部华小五年级《历史》课本（KSSR 修订版）内容编写，答案以课本说法为准。</footer>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="score">
      <span>已答 <b id="sDone">0</b>/<span id="sTot">0</span></span>
      <span class="r">对 <b id="sRight">0</b></span>
      <span class="w">错 <b id="sWrong">0</b></span>
    </div>
    <div class="row">
      <button class="btn ghost" id="redoWrong" type="button" hidden>只练错题</button>
      <button class="btn gold" id="submit" type="button" hidden>交卷</button>
    </div>
    <div class="track" aria-hidden="true"><i id="prog"></i></div>
  </div>
</div>

<script>
// 单元一 ~ 单元三
const Q1 = [
// ===== 单元一 君主立宪是国家的保护伞 =====
{u:1,q:"拉惹或苏丹是什么的首脑？",o:["政府","军队","法院","学校"],a:0,e:"拉惹或苏丹是政府的首脑，政府是指君主统治的州属或国家。"},
{u:1,q:"“政府”是指什么？",o:["人民选出的组织","君主统治的州属或国家","外国派来的官员","一个商业团体"],a:1,e:"课本说明：政府是指君主统治的州属或国家。"},
{u:1,q:"我国的君主制度源自什么时候？",o:["英殖民时代","日据时期","早期马来王国","国家独立后"],a:2,e:"君主制度源于早期的马来王国，当时最高领导者是拉惹或苏丹。"},
{u:1,q:"伊斯兰教传入之后，大多数拉惹改用什么称号？",o:["严端","苏丹","州元首","首相"],a:1,e:"伊斯兰教传入后，大多数拉惹都改用苏丹的称号。"},
{u:1,q:"现今我国共有多少个州属实行君主制度？",o:["7个","8个","9个","13个"],a:2,e:"我国共有九个州属实行君主制度。"},
{u:1,q:"玻璃市州的统治者称为什么？",o:["苏丹","拉惹","严端","州元首"],a:1,e:"玻璃市的君主称为拉惹。"},
{u:1,q:"森美兰州的统治者称为什么？",o:["拉惹","苏丹","最高统治者或严端","州元首"],a:2,e:"森美兰州的君主称为最高统治者或严端（Yang di-Pertuan Besar）。"},
{u:1,q:"以下哪一个州属<b>没有</b>实行君主制度？",o:["吉打","彭亨","马六甲","登嘉楼"],a:2,e:"槟城、马六甲、砂拉越和沙巴都没有实行君主制度。"},
{u:1,q:"槟城、马六甲、砂拉越和沙巴的州元首由谁委任？",o:["首相","国家元首","州务大臣","英国总督"],a:1,e:"这些州的州元首由国家元首委任。"},
{u:1,q:"吉隆坡、布城和纳闽联邦直辖区的最高统治者是谁？",o:["首相","雪兰莪苏丹","国家元首","联邦直辖区部长"],a:2,e:"国家元首是吉隆坡、布城与纳闽联邦直辖区的最高统治者。"},
{u:1,q:"《马来纪年》记载了哪两个人之间的协议？",o:["东姑阿都拉曼与艾伦勋爵","斯里德里布阿纳与德芒乐巴尔达温","苏丹阿都拉与毕治","拜里米苏拉与郑和"],a:1,e:"《马来纪年》记载了君主斯里德里布阿纳与人民德芒乐巴尔达温之间的协议。"},
{u:1,q:"君臣协议是指什么？",o:["君主与外国的贸易协议","人民与君主的效忠协议","大臣之间的分工协议","州属之间的和平协议"],a:1,e:"君臣协议指人民与君主的效忠协议，是建立效忠行为的基础。"},
{u:1,q:"根据君臣协议，人民答应效忠君主，君主则必须怎样？",o:["公正无私地统治人民","把土地分给人民","不必缴税","每年出国访问"],a:0,e:"人民答应效忠君主，君主则公正无私地统治人民，不侮辱人民。"},
{u:1,q:"我国独立后，君臣协议的概念反映在国家原则的哪一条？",o:["信奉上苍","忠于君国","维护宪法","尊崇法治"],a:1,e:"君臣协议概念反映在国家原则中的“忠于君国”。"},
{u:1,q:"“君权”一词源自阿拉伯语“daulah”，意思是什么？",o:["国家或政府","国王的宝剑","人民的力量","宗教领袖"],a:0,e:"君权源自阿拉伯语“daulah”，意指国家或政府。"},
{u:1,q:"君权象征着什么？",o:["人民的财富","君主的执政权力","外国的保护","宗教的教义"],a:1,e:"君权象征君主的执政权力，君主以贤明、高尚品德与睿智管理政府。"},
{u:1,q:"人民违逆拉惹或苏丹的命令，被称为什么？",o:["君权","效忠","背叛","干政"],a:2,e:"背叛表示人民违逆拉惹或苏丹的命令，将受到相应的惩罚。"},
{u:1,q:"在早期马来王国时代，拉惹或苏丹拥有什么权力？",o:["绝对的权力","没有任何权力","只负责宗教事务","依据联邦宪法行使权力"],a:0,e:"早期马来王国时代，拉惹或苏丹在行政上拥有绝对的权力，是行政、司法与律法、外交事务的裁决者。"},
{u:1,q:"在早期马来王国，谁协助拉惹或苏丹管理州内的行政事务？",o:["参政司","大臣","首相","日本总督"],a:1,e:"大臣协助拉惹或苏丹管理州内的行政事务。"},
{u:1,q:"英殖民时代，苏丹委任英国人担任什么职务？",o:["州务大臣","行政事务顾问","宗教领袖","军队司令"],a:1,e:"英殖民时代，苏丹委任英国人担任各州行政事务顾问，君主不再拥有绝对的权力。"},
{u:1,q:"英殖民时代与日据时期，拉惹或苏丹仍然是哪方面的领袖？",o:["军事与外交","伊斯兰教和马来风俗","商业与贸易","教育与卫生"],a:1,e:"这两个时期，拉惹或苏丹仍是各自州属伊斯兰教和马来风俗的领袖，但没有绝对权力。"},
{u:1,q:"日据时期，马来州属的行政事务由谁管理？",o:["英国参政司","马来苏丹","日本总督","州务大臣"],a:2,e:"日据时期，日本总督管理马来州属的行政事务。"},
{u:1,q:"1941年，日军在哪里登陆马来亚？",o:["吉兰丹哥打峇鲁","柔佛新山","槟城乔治市","雪兰莪巴生"],a:0,e:"1941年日军登陆吉兰丹的哥打峇鲁。"},
{u:1,q:"独立至今，州的行政事务由谁掌管？",o:["州务大臣","英国顾问官","日本总督","国家元首"],a:0,e:"独立后实行君主立宪制度，州务大臣掌管州行政事务，并由州行政议会协助管理。"},
{u:1,q:"独立后，国家行政事务由谁掌管，并由内阁协助？",o:["国家元首","首相","州务大臣","统治者理事会"],a:1,e:"首相掌管国家行政事务，并由内阁协助。内阁是由首相和部长所领导的行政机构。"},
{u:1,q:"现今的拉惹或苏丹根据什么行使权力？",o:["自己的意愿","宪法","英国的指示","大臣的决定"],a:1,e:"独立至今实行君主立宪制度，拉惹或苏丹根据（州/联邦）宪法行使权力。"},
{u:1,q:"国家元首由几位马来统治者轮流担任？",o:["七位","八位","九位","十三位"],a:2,e:"九位马来统治者轮流担任国家元首。"},
{u:1,q:"世界上最古老的行政制度是什么？",o:["民主制度","君主制度","共和制度","殖民制度"],a:1,e:"君主制度是世界上最古老的行政制度，君王是首脑。"},
{u:1,q:"根据课本，现今全世界共有多少个国家仍实行君主制度？",o:["9个","25个","43个","100个"],a:2,e:"全世界共有43个国家仍实行君主制度，包括马来西亚。"},

const ALL = [...Q1, ...Q2, ...Q3];
const UNITS = {
  1:"君主立宪是国家的保护伞",2:"马来西亚的伊斯兰教",3:"马来语是我们的遗产",
  4:"国家主权的挑战",5:"地方领袖的起义与抗争",6:"国家独立的历史",
  7:"国家元首是国家主权的核心",8:"马来西亚的国徽",9:"马来西亚的国旗",
  10:"马来西亚的国歌",11:"马来语是国语",12:"我国的国花大红花"
};
const CN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"];
const THEMES = [
  ["主题六 · 我们的国家遗产",[1,2,3]],
  ["主题七 · 国家独立的抗争",[4,5,6]],
  ["主题八 · 国家元首",[7]],
  ["主题九 · 国家的象征",[8,9,10,11,12]]
];
const LETTERS = ["A","B","C","D"];
const $ = s => document.querySelector(s);

let selected = new Set(Object.keys(UNITS).map(Number));
let mode = "practice";
let paper = [];      // [{q, order:[idx...], pick:null}]
let submitted = false;
let seed = 20261006;

function rng(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

$("#total").textContent = ALL.length;

function counts(){ const c={}; ALL.forEach(q=>c[q.u]=(c[q.u]||0)+1); return c; }
function renderChips(){
  const c = counts();
  $("#themes").innerHTML = THEMES.map(([name,us])=>`
    <div class="theme"><div class="theme-name">${name}</div>
      <div class="chips">${us.map(u=>`<button type="button" class="chip" data-u="${u}" aria-pressed="${selected.has(u)}">单元${CN[u]} ${UNITS[u]} <span class="n">${c[u]||0}</span></button>`).join("")}</div>
    </div>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const u=+b.dataset.u; selected.has(u)?selected.delete(u):selected.add(u);
    b.setAttribute("aria-pressed", selected.has(u)); $("#start").disabled = selected.size===0;
  });
  $("#start").disabled = selected.size===0;
}
$("#selAll").onclick=()=>{ selected=new Set(Object.keys(UNITS).map(Number)); renderChips(); };
$("#selNone").onclick=()=>{ selected.clear(); renderChips(); };

function setMode(m){ mode=m; $("#mPractice").setAttribute("aria-pressed",m==="practice"); $("#mExam").setAttribute("aria-pressed",m==="exam"); }
$("#mPractice").onclick=()=>{ setMode("practice"); build(); };
$("#mExam").onclick=()=>{ setMode("exam"); build(); };

function build(pool){
  submitted=false;
  let qs = pool || ALL.filter(q=>selected.has(q.u));
  if(!pool && $("#order").value==="mix") qs = shuffle(qs);
  const n = +$("#count").value;
  if(!pool && n>0 && qs.length>n){ qs = shuffle(qs).slice(0,n); if($("#order").value==="unit") qs.sort((a,b)=>a.u-b.u); }
  paper = qs.map(q=>({q, order: shuffle([0,1,2,3]), pick:null}));
  render();
}

function render(){
  $("#result").hidden = true;
  const list = $("#list");
  if(!paper.length){ list.innerHTML = `<div class="empty">请至少选择一个单元，然后按「开始 / 重新出题」。</div>`; update(); return; }
  let lastU = null;
  list.innerHTML = paper.map((p,i)=>{
    const q=p.q;
    return `<article class="q" id="q${i}" data-i="${i}">
      <div class="q-top"><span class="q-no">${i+1}.</span><span class="q-tag">单元${CN[q.u]} · ${UNITS[q.u]}</span>
        <div class="q-text">${q.q}</div></div>
      <div class="opts">${p.order.map((oi,k)=>`<button type="button" class="opt" data-k="${k}"><span class="k">${LETTERS[k]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>
      <div class="explain" hidden></div>
    </article>`;
  }).join("");
  list.querySelectorAll(".q").forEach(card=>{
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+card.dataset.i, +b.dataset.k));
  });
  update();
}

function paint(i){
  const p = paper[i], card = $("#q"+i), q = p.q;
  const correctK = p.order.indexOf(q.a);
  const reveal = mode==="practice" ? p.pick!==null : submitted;
  card.classList.remove("ok","bad");
  card.querySelectorAll(".opt").forEach(b=>{
    const k=+b.dataset.k;
    b.classList.remove("picked","is-right","is-wrong");
    if(reveal){
      b.disabled = true;
      if(k===correctK) b.classList.add("is-right");
      else if(k===p.pick) b.classList.add("is-wrong");
    } else {
      b.disabled = false;
      if(k===p.pick) b.classList.add("picked");
    }
  });
  const ex = card.querySelector(".explain");
  if(reveal){
    const ok = p.pick===correctK;
    if(p.pick!==null) card.classList.add(ok?"ok":"bad");
    ex.innerHTML = (p.pick===null? `<strong>未作答。</strong> ` : ok? `<strong class="verdict-ok">答对了！</strong> ` : `<strong class="verdict-bad">答错了，正确答案是 ${LETTERS[correctK]}。</strong> `) + q.e;
    ex.hidden = false;
  } else ex.hidden = true;
}

function answer(i,k){
  const p = paper[i];
  if(mode==="practice" && p.pick!==null) return;
  if(submitted) return;
  p.pick = k; paint(i); update();
}

function stats(){
  let done=0,right=0,wrong=0;
  paper.forEach(p=>{ if(p.pick!==null){ done++; if(p.pick===p.order.indexOf(p.q.a)) right++; else wrong++; } });
  return {done,right,wrong};
}
function update(){
  const s = stats(), reveal = mode==="practice" || submitted;
  $("#sDone").textContent=s.done; $("#sTot").textContent=paper.length;
  $("#sRight").textContent= reveal? s.right : "–";
  $("#sWrong").textContent= reveal? s.wrong : "–";
  $("#prog").style.width = paper.length? (s.done/paper.length*100)+"%" : "0";
  $("#submit").hidden = !(mode==="exam" && !submitted && paper.length);
  $("#submit").textContent = "交卷";
  const finished = (mode==="practice" && s.done===paper.length && paper.length) || submitted;
  $("#redoWrong").hidden = !(reveal && s.wrong>0);
  if(finished) showResult(); else $("#result").hidden = true;
}

$("#submit").onclick=()=>{
  const left = paper.length - stats().done;
  const btn = $("#submit");
  if(left>0 && btn.dataset.confirm!=="1"){ btn.dataset.confirm="1"; btn.textContent=`还有 ${left} 题没答，再按一次交卷`; setTimeout(()=>{btn.dataset.confirm="";btn.textContent="交卷";},4000); return; }
  btn.dataset.confirm="";
  submitted=true; paper.forEach((_,i)=>paint(i)); update();
  $("#result").scrollIntoView({behavior:"smooth",block:"start"});
};
$("#redoWrong").onclick=()=>{
  const wrongs = paper.filter(p=>p.pick===null ? submitted : p.pick!==p.order.indexOf(p.q.a)).map(p=>p.q);
  if(!wrongs.length) return;
  build(shuffle(wrongs)); window.scrollTo({top: $("#list").offsetTop-10, behavior:"smooth"});
};
$("#start").onclick=()=>{ build(); window.scrollTo({top: $("#list").offsetTop-10, behavior:"smooth"}); };

function showResult(){
  const s = stats(), tot = paper.length, pct = Math.round(s.right/tot*100);
  const by = {};
  paper.forEach(p=>{ const u=p.q.u; by[u]=by[u]||{t:0,r:0}; by[u].t++; if(p.pick===p.order.indexOf(p.q.a)) by[u].r++; });
  const grade = pct>=85?"A":pct>=70?"B":pct>=50?"C":pct>=40?"D":"E";
  const el = $("#result");
  el.innerHTML = `<h2>成绩</h2>
    <div class="row" style="gap:24px"><div class="big">${s.right}<small> / ${tot}</small></div>
      <div><div class="label">得分率</div><div class="big" style="font-size:30px">${pct}%</div></div>
      <div><div class="label">等级（参考）</div><div class="big" style="font-size:30px;color:var(--navy)">${grade}</div></div></div>
    <div class="label">各单元表现</div>
    <div class="units">${Object.keys(by).sort((a,b)=>a-b).map(u=>{const b=by[u],p=Math.round(b.r/b.t*100);
      const col = p>=70?"var(--right)":p>=50?"var(--gold)":"var(--wrong)";
      return `<div class="u"><span>单元${CN[u]} ${UNITS[u]}</span><span class="pct">${b.r}/${b.t}</span><span class="m"><i style="width:${p}%;background:${col}"></i></span></div>`;}).join("")}</div>
    <p class="hint">红色和黄色的单元要多复习。按下方「只练错题」可以把答错的题目重新练一次。</p>`;
  el.hidden = false;
}

// 键盘：A-D 回答第一道还没作答、在画面中的题
document.addEventListener("keydown",e=>{
  const k = "abcd".indexOf(e.key.toLowerCase()); if(k<0 || e.target.closest("select")) return;
  const cards=[...document.querySelectorAll(".q")];
  const vh = window.innerHeight;
  const card = cards.find(c=>{ const r=c.getBoundingClientRect(); const p=paper[+c.dataset.i]; return r.bottom>60 && r.top<vh-80 && (mode==="exam" ? !submitted : p.pick===null); });
  if(card){ answer(+card.dataset.i,k); }
});

renderChips(); setMode("practice"); build();
</script>
